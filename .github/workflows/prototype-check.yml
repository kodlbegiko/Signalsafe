name: Prototype checks

on:
  pull_request:
    paths:
      - "prototype/**"
      - "package.json"
      - "vercel.json"
      - ".github/workflows/prototype-check.yml"
  push:
    branches: [main]
    paths:
      - "prototype/**"
      - "package.json"
      - "vercel.json"
      - ".github/workflows/prototype-check.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check
      - name: Run tests
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.txt
      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prototype-test-output
          path: test-output.txt
          if-no-files-found: error
