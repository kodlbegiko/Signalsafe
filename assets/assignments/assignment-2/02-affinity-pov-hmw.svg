<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#f5f9ff"/><rect width="1600" height="135" fill="#083b7a"/><text x="55" y="72" font-size="50" font-family="sans-serif" fill="white" font-weight="700">作業二｜2. 親和圖、洞察、POV與HMW</text><text x="55" y="118" font-size="30" font-family="sans-serif" fill="#dcebff">從探索性訪談重新萃取共同需求</text><g font-family="sans-serif" fill="#17365d"><rect x="35" y="170" width="720" height="520" rx="22" fill="white" stroke="#b8cce4" stroke-width="3"/><rect x="35" y="170" width="720" height="68" rx="22" fill="#6f42c1"/><text x="70" y="215" font-size="31" fill="white" font-weight="700">親和圖分群</text><text x="75" y="295" font-size="24">• 接觸情境：假遊戲福利、假中獎、陌生社群、可疑連結</text><text x="75" y="360" font-size="24">• 判斷困難：單一關鍵字、缺固定流程、難分三類</text><text x="75" y="425" font-size="24">• 現有行為：不回覆、不給個資、比對官網、詢問家人</text><text x="75" y="490" font-size="24">• 期待功能：真實案例、風險解析、短影音、檢舉教學</text><text x="75" y="555" font-size="24">• 使用限制：流程不能太長、文字不能像長篇教材</text><rect x="785" y="170" width="780" height="245" rx="22" fill="white" stroke="#b8cce4" stroke-width="3"/><rect x="785" y="170" width="780" height="68" rx="22" fill="#0b5dbb"/><text x="820" y="215" font-size="31" fill="white" font-weight="700">需求洞察</text><text x="825" y="300" font-size="25">學生不是完全沒有警覺，真正缺口是：</text><text x="825" y="350" font-size="24" font-weight="700">在資訊不完整、時間壓力與熟人情境下，仍能辨識</text><text x="825" y="385" font-size="24" font-weight="700">高風險操作並採取安全下一步的固定流程。</text><rect x="785" y="440" width="780" height="250" rx="22" fill="white" stroke="#b8cce4" stroke-width="3"/><rect x="785" y="440" width="780" height="68" rx="22" fill="#198754"/><text x="820" y="485" font-size="31" fill="white" font-weight="700">設計觀點 POV</text><text x="825" y="570" font-size="23">一位高頻使用社群與數位服務、具基本防詐警覺的</text><text x="825" y="610" font-size="23">16–18歲高中生，需要短時間、情境化、能清楚解釋</text><text x="825" y="650" font-size="23">風險並教導查證、封鎖、檢舉與求助的訓練工具。</text><rect x="35" y="720" width="1530" height="145" rx="22" fill="#fff7e8" stroke="#e67e22" stroke-width="3"/><text x="70" y="765" font-size="31" fill="#e67e22" font-weight="700">How Might We</text><text x="70" y="815" font-size="25" font-weight="700">我們如何透過60–90秒的情境化訓練，幫助學生辨識關鍵風險訊號、停止高風險操作，</text><text x="70" y="850" font-size="25" font-weight="700">並改走官方查證、封鎖、檢舉或求助？</text></g></svg>