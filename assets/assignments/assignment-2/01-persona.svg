<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#f5f9ff"/><rect width="1600" height="135" fill="#083b7a"/><text x="55" y="72" font-size="50" font-family="sans-serif" fill="white" font-weight="700">作業二｜1. 目標對象人物誌</text><text x="55" y="118" font-size="30" font-family="sans-serif" fill="#dcebff">綜合人物誌：小宇</text><g font-family="sans-serif" fill="#17365d"><rect x="40" y="175" width="500" height="620" rx="22" fill="white" stroke="#b8cce4" stroke-width="3"/><rect x="40" y="175" width="500" height="68" rx="22" fill="#0b5dbb"/><text x="75" y="220" font-size="31" fill="white" font-weight="700">基本資料與行為</text><text x="80" y="300" font-size="24">• 16–18歲高中階段學生</text><text x="80" y="360" font-size="24">• 常用社群、通訊與手機遊戲</text><text x="80" y="420" font-size="24">• 每天接觸陌生訊息與活動連結</text><text x="80" y="480" font-size="24">• 會比對官方資訊或詢問可信任者</text><text x="80" y="540" font-size="24">• 不輕易給個資，但流程不穩定</text><rect x="565" y="175" width="500" height="620" rx="22" fill="white" stroke="#b8cce4" stroke-width="3"/><rect x="565" y="175" width="500" height="68" rx="22" fill="#e67e22"/><text x="600" y="220" font-size="31" fill="white" font-weight="700">主要痛點</text><text x="605" y="300" font-size="24">• 判斷標準不完整，依賴單一關鍵字</text><text x="605" y="360" font-size="24">• 容易過度警判正常或資訊不足訊息</text><text x="605" y="420" font-size="24">• 不知道官方查證的正確順序</text><text x="605" y="480" font-size="24">• 限時與熟人情境會降低警覺</text><text x="605" y="540" font-size="24">• 傳統長篇宣導缺乏參與感</text><rect x="1090" y="175" width="470" height="620" rx="22" fill="white" stroke="#b8cce4" stroke-width="3"/><rect x="1090" y="175" width="470" height="68" rx="22" fill="#198754"/><text x="1125" y="220" font-size="31" fill="white" font-weight="700">核心需求與設計回應</text><text x="1130" y="300" font-size="24">• 快速完成：3題，60–90秒</text><text x="1130" y="360" font-size="24">• 三分類：風險／不足／較可信</text><text x="1130" y="420" font-size="24">• 拆解話術、來源、行為與金流</text><text x="1130" y="480" font-size="24">• 提供查證、封鎖、檢舉與求助</text><text x="1130" y="540" font-size="24">• 使用情境化、遊戲化與短影音</text><rect x="40" y="815" width="1520" height="55" rx="16" fill="#eaf2ff" stroke="#0b5dbb"/><text x="75" y="852" font-size="24" font-weight="700">使用目標：收到社群、遊戲、票券、交易或帳號通知時，先停止高風險操作，找出關鍵訊號並改走官方查證。</text></g></svg>