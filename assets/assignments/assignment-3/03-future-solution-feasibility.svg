<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#f5f9ff"/><rect width="1600" height="135" fill="#083b7a"/><text x="55" y="72" font-size="50" font-family="sans-serif" fill="white" font-weight="700">作業三｜3-4. 未來潛力的解決方案</text><text x="55" y="118" font-size="30" font-family="sans-serif" fill="#dcebff">從一次性情境測驗，升級為可持續的學生防詐決策訓練系統</text><g font-family="sans-serif" fill="#17365d"><rect x="35" y="175" width="430" height="500" rx="22" fill="white" stroke="#b8cce4" stroke-width="3"/><rect x="35" y="175" width="430" height="68" rx="22" fill="#0b5dbb"/><text x="70" y="220" font-size="31" fill="white" font-weight="700">初賽提案</text><text x="80" y="320" font-size="27" font-weight="700">• 情境題練習</text><text x="80" y="390" font-size="27" font-weight="700">• 風險判斷</text><text x="80" y="460" font-size="27" font-weight="700">• 簡短解析</text><text x="80" y="560" font-size="23">限制：偏一次性測驗，缺少持續練習、</text><text x="80" y="595" font-size="23">盲點診斷與後續保留機制。</text><rect x="495" y="175" width="520" height="500" rx="22" fill="white" stroke="#b8cce4" stroke-width="3"/><rect x="495" y="175" width="520" height="68" rx="22" fill="#6f42c1"/><text x="530" y="220" font-size="31" fill="white" font-weight="700">複賽升級方案</text><text x="540" y="305" font-size="25">• 90秒日常快練</text><text x="540" y="360" font-size="25">• 個人盲點診斷</text><text x="540" y="415" font-size="25">• 研究模式與變形題</text><text x="540" y="470" font-size="25">• 急救模式</text><text x="540" y="525" font-size="25">• 第7天延遲複習</text><text x="540" y="580" font-size="25">• 本機匿名資料</text><rect x="1045" y="175" width="520" height="500" rx="22" fill="white" stroke="#b8cce4" stroke-width="3"/><rect x="1045" y="175" width="520" height="68" rx="22" fill="#198754"/><text x="1080" y="220" font-size="31" fill="white" font-weight="700">六構面可行性</text><text x="1090" y="300" font-size="23">1. 永續議題重要性：高</text><text x="1090" y="355" font-size="23">2. 目標對象真實需求：高，仍需正式樣本</text><text x="1090" y="410" font-size="23">3. 科技適切性：中高，PWA可行</text><text x="1090" y="465" font-size="23">4. 商業／導入可行性：中，先校園導入</text><text x="1090" y="520" font-size="23">5. 可持續發展：中高，題庫可更新</text><text x="1090" y="575" font-size="23">6. 團隊資源：中，仍需測試與版本迭代</text><rect x="35" y="710" width="1530" height="150" rx="22" fill="#fff7e8" stroke="#e67e22" stroke-width="3"/><text x="70" y="760" font-size="31" fill="#e67e22" font-weight="700">方案結論</text><text x="70" y="815" font-size="26" font-weight="700">SignalSafe 的未來潛力在於：把防詐從單次提醒，轉成可重複、可追蹤、</text><text x="70" y="850" font-size="26" font-weight="700">可逐步提升的學生決策訓練系統。</text></g></svg>