<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<rect width="1600" height="900" fill="#f5f9ff"/><rect width="1600" height="135" fill="#083b7a"/>
<text x="55" y="72" font-size="50" font-family="sans-serif" fill="white" font-weight="700">作業三｜3-2. 國內外相關案例分析</text>
<text x="55" y="118" font-size="28" font-family="sans-serif" fill="#dcebff">官方功能來源已查核；優缺點與學習點為 SignalSafe 團隊分析</text>
<g font-family="sans-serif" fill="#17365d">
<rect x="35" y="170" width="480" height="565" rx="22" fill="white" stroke="#b8cce4" stroke-width="3"/><rect x="35" y="170" width="480" height="68" rx="22" fill="#198754"/>
<text x="70" y="215" font-size="31" fill="white" font-weight="700">165 全民防騙網</text>
<text x="75" y="285" font-size="24" font-weight="700">官方功能</text><text x="75" y="325" font-size="21">報案、檢舉、檢舉詐騙廣告、</text><text x="75" y="358" font-size="21">涉詐公告與防詐資訊。</text>
<text x="75" y="415" font-size="24" font-weight="700">優點</text><text x="75" y="455" font-size="21">官方權威、正式處理與求助入口。</text>
<text x="75" y="512" font-size="24" font-weight="700">邊界</text><text x="75" y="552" font-size="21">不是反覆個人化判斷訓練。</text>
<text x="75" y="610" font-size="24" font-weight="700">SignalSafe 學習</text><text x="75" y="650" font-size="21">回饋應提供官方查證、檢舉與求助。</text>

<rect x="560" y="170" width="480" height="565" rx="22" fill="white" stroke="#b8cce4" stroke-width="3"/><rect x="560" y="170" width="480" height="68" rx="22" fill="#198754"/>
<text x="595" y="215" font-size="31" fill="white" font-weight="700">Whoscall</text>
<text x="600" y="285" font-size="24" font-weight="700">官方功能</text><text x="600" y="325" font-size="21">來電辨識、封鎖，以及電話、連結、</text><text x="600" y="358" font-size="21">截圖與訊息的風險查詢。</text>
<text x="600" y="415" font-size="24" font-weight="700">優點</text><text x="600" y="455" font-size="21">即時、貼近日常通訊、輸入型態多。</text>
<text x="600" y="512" font-size="24" font-weight="700">邊界</text><text x="600" y="552" font-size="21">核心是辨識與防護，不以能力遷移為主。</text>
<text x="600" y="610" font-size="24" font-weight="700">SignalSafe 學習</text><text x="600" y="650" font-size="21">結果要快速、清楚並解釋主要理由。</text>

<rect x="1085" y="170" width="480" height="565" rx="22" fill="white" stroke="#b8cce4" stroke-width="3"/><rect x="1085" y="170" width="480" height="68" rx="22" fill="#198754"/>
<text x="1120" y="215" font-size="29" fill="white" font-weight="700">Google Messages</text>
<text x="1125" y="285" font-size="24" font-weight="700">官方功能</text><text x="1125" y="325" font-size="21">垃圾／詐騙訊息偵測、封鎖、</text><text x="1125" y="358" font-size="21">移至垃圾資料夾與回報。</text>
<text x="1125" y="415" font-size="24" font-weight="700">優點</text><text x="1125" y="455" font-size="21">防護直接整合在日常通訊流程。</text>
<text x="1125" y="512" font-size="24" font-weight="700">邊界</text><text x="1125" y="552" font-size="21">場景限於特定產品，不能涵蓋所有新情境。</text>
<text x="1125" y="610" font-size="24" font-weight="700">SignalSafe 學習</text><text x="1125" y="650" font-size="21">安全行動要融入流程，仍需訓練判斷。</text>

<rect x="35" y="765" width="1530" height="100" rx="18" fill="#eaf2ff" stroke="#0b5dbb" stroke-width="3"/>
<text x="70" y="805" font-size="27" fill="#0b5dbb" font-weight="700">產品收斂</text>
<text x="70" y="845" font-size="22">成熟工具負責防護、辨識與官方查證；SignalSafe 負責短情境練習、盲點診斷、變形題遷移與延遲保留測量。</text>
</g></svg>