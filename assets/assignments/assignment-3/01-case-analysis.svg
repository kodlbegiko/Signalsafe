<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#f5f9ff"/><rect width="1600" height="135" fill="#083b7a"/><text x="55" y="72" font-size="50" font-family="sans-serif" fill="white" font-weight="700">作業三｜3-2. 國內外相關案例分析</text><text x="55" y="118" font-size="30" font-family="sans-serif" fill="#dcebff">比較既有防詐工具的優點、缺點與可學習之處</text><g font-family="sans-serif" fill="#17365d"><rect x="35" y="170" width="480" height="560" rx="22" fill="white" stroke="#b8cce4" stroke-width="3"/><rect x="35" y="170" width="480" height="68" rx="22" fill="#198754"/><text x="70" y="215" font-size="31" fill="white" font-weight="700">165 全民防騙網</text><text x="75" y="305" font-size="25" font-weight="700">優點</text><text x="75" y="350" font-size="23">官方可信、查證資源完整、</text><text x="75" y="385" font-size="23">可連結真實求助管道。</text><text x="75" y="455" font-size="25" font-weight="700">缺點</text><text x="75" y="500" font-size="23">偏資訊查詢，互動與練習感較弱。</text><text x="75" y="575" font-size="25" font-weight="700">SignalSafe 可學習</text><text x="75" y="620" font-size="23">官方查證入口一定要清楚。</text><rect x="560" y="170" width="480" height="560" rx="22" fill="white" stroke="#b8cce4" stroke-width="3"/><rect x="560" y="170" width="480" height="68" rx="22" fill="#198754"/><text x="595" y="215" font-size="31" fill="white" font-weight="700">Whoscall</text><text x="600" y="305" font-size="25" font-weight="700">優點</text><text x="600" y="350" font-size="23">即時辨識來電與訊息，實用性高。</text><text x="600" y="455" font-size="25" font-weight="700">缺點</text><text x="600" y="500" font-size="23">偏攔截與辨識，不是訓練判斷能力</text><text x="600" y="535" font-size="23">的學習工具。</text><text x="600" y="610" font-size="25" font-weight="700">SignalSafe 可學習</text><text x="600" y="655" font-size="23">提醒要快、操作要簡單。</text><rect x="1085" y="170" width="480" height="560" rx="22" fill="white" stroke="#b8cce4" stroke-width="3"/><rect x="1085" y="170" width="480" height="68" rx="22" fill="#198754"/><text x="1120" y="215" font-size="31" fill="white" font-weight="700">Google Messages 詐騙警示</text><text x="1125" y="305" font-size="25" font-weight="700">優點</text><text x="1125" y="350" font-size="23">在訊息當下提供提示，降低風險。</text><text x="1125" y="455" font-size="25" font-weight="700">缺點</text><text x="1125" y="500" font-size="23">偏系統保護，使用者容易被動依賴。</text><text x="1125" y="575" font-size="25" font-weight="700">SignalSafe 可學習</text><text x="1125" y="620" font-size="23">提供即時情境，但不能取代使用者判斷。</text><rect x="35" y="760" width="1530" height="110" rx="18" fill="#eaf2ff" stroke="#0b5dbb" stroke-width="3"/><text x="70" y="805" font-size="27" fill="#0b5dbb" font-weight="700">產品收斂</text><text x="70" y="845" font-size="23">保留即時提醒與官方查證優點，但以短時、情境化、可重複練習為核心，從「偵測工具」轉為「決策訓練系統」。</text></g></svg>