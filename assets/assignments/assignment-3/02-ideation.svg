<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#f5f9ff"/><rect width="1600" height="135" fill="#083b7a"/><text x="55" y="72" font-size="50" font-family="sans-serif" fill="white" font-weight="700">作業三｜3-3. 創意發想</text><text x="55" y="118" font-size="30" font-family="sans-serif" fill="#dcebff">互動設計、內容設計與功能設計共12個點子</text><g font-family="sans-serif" fill="#17365d"><rect x="35" y="170" width="490" height="600" rx="22" fill="white" stroke="#b8cce4" stroke-width="3"/><rect x="35" y="170" width="490" height="68" rx="22" fill="#0b5dbb"/><text x="70" y="215" font-size="31" fill="white" font-weight="700">互動設計</text><text x="80" y="305" font-size="26" font-weight="700">1. 90秒快練</text><text x="110" y="345" font-size="22">每天快速完成3題情境判斷</text><text x="80" y="420" font-size="26" font-weight="700">2. 變形題</text><text x="110" y="460" font-size="22">同一詐騙手法換情境再練一次</text><text x="80" y="535" font-size="26" font-weight="700">3. 連續答題挑戰</text><text x="110" y="575" font-size="22">以關卡形式建立持續練習動機</text><text x="80" y="650" font-size="26" font-weight="700">4. 限時判斷</text><text x="110" y="690" font-size="22">模擬真實壓力下的快速判斷</text><rect x="555" y="170" width="490" height="600" rx="22" fill="white" stroke="#b8cce4" stroke-width="3"/><rect x="555" y="170" width="490" height="68" rx="22" fill="#198754"/><text x="590" y="215" font-size="31" fill="white" font-weight="700">內容設計</text><text x="600" y="305" font-size="26" font-weight="700">5. 真實案例卡</text><text x="630" y="345" font-size="22">用常見社群、遊戲與交易情境教學</text><text x="600" y="420" font-size="26" font-weight="700">6. 語音／短影音說明</text><text x="630" y="460" font-size="22">以15–30秒快速解釋可疑點</text><text x="600" y="535" font-size="26" font-weight="700">7. 風險解析回饋</text><text x="630" y="575" font-size="22">答題後立即拆解話術與來源</text><text x="600" y="650" font-size="26" font-weight="700">8. 錯題複習</text><text x="630" y="690" font-size="22">針對常錯題型再次練習</text><rect x="1075" y="170" width="490" height="600" rx="22" fill="white" stroke="#b8cce4" stroke-width="3"/><rect x="1075" y="170" width="490" height="68" rx="22" fill="#e67e22"/><text x="1110" y="215" font-size="31" fill="white" font-weight="700">功能設計</text><text x="1120" y="305" font-size="26" font-weight="700">9. 個人盲點診斷</text><text x="1150" y="345" font-size="22">統整最常忽略的詐騙訊號</text><text x="1120" y="420" font-size="26" font-weight="700">10. 延遲複習</text><text x="1150" y="460" font-size="22">過幾天再測相似題檢查是否保留</text><text x="1120" y="535" font-size="26" font-weight="700">11. 急救模式</text><text x="1150" y="575" font-size="22">遇可疑情況時提供停手與查證路徑</text><text x="1120" y="650" font-size="26" font-weight="700">12. 校園導入任務</text><text x="1150" y="690" font-size="22">搭配班級、社團或新生教育活動</text><rect x="35" y="800" width="1530" height="65" rx="18" fill="#eaf2ff" stroke="#0b5dbb"/><text x="70" y="843" font-size="24" font-weight="700">收斂原則：每個點子都要回應「短時間、情境化、可操作」，並支援查證、封鎖、檢舉與求助。</text></g></svg>