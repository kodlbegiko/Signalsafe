<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#f5f9ff"/><rect width="1600" height="135" fill="#083b7a"/><text x="55" y="72" font-size="50" font-family="sans-serif" fill="white" font-weight="700">作業三｜3-5. 故事版</text><text x="55" y="118" font-size="30" font-family="sans-serif" fill="#dcebff">以真實社群情境說明 SignalSafe 的使用流程與價值</text><g font-family="sans-serif" fill="#17365d"><rect x="35" y="170" width="490" height="280" rx="22" fill="white" stroke="#b8cce4" stroke-width="3"/><rect x="35" y="170" width="490" height="62" rx="22" fill="#0b5dbb"/><text x="65" y="212" font-size="30" fill="white" font-weight="700">1. 看見貼文</text><text x="70" y="290" font-size="24">高中生在社群看到「免費遊戲造型，</text><text x="70" y="330" font-size="24">今天截止」並附外部連結。</text><rect x="555" y="170" width="490" height="280" rx="22" fill="white" stroke="#b8cce4" stroke-width="3"/><rect x="555" y="170" width="490" height="62" rx="22" fill="#0b5dbb"/><text x="585" y="212" font-size="30" fill="white" font-weight="700">2. 覺得可疑</text><text x="590" y="290" font-size="24">連結要求登入帳號與輸入驗證資料，</text><text x="590" y="330" font-size="24">不確定是詐騙或資訊不足。</text><rect x="1075" y="170" width="490" height="280" rx="22" fill="white" stroke="#b8cce4" stroke-width="3"/><rect x="1075" y="170" width="490" height="62" rx="22" fill="#0b5dbb"/><text x="1105" y="212" font-size="30" fill="white" font-weight="700">3. 打開 SignalSafe</text><text x="1110" y="290" font-size="24">進入90秒快練／急救模式，</text><text x="1110" y="330" font-size="24">先檢查訊息風險。</text><rect x="35" y="480" width="490" height="280" rx="22" fill="white" stroke="#b8cce4" stroke-width="3"/><rect x="35" y="480" width="490" height="62" rx="22" fill="#198754"/><text x="65" y="522" font-size="30" fill="white" font-weight="700">4. 看懂風險原因</text><text x="70" y="600" font-size="24">辨識非官方來源、限時催促、</text><text x="70" y="640" font-size="24">要求帳號或驗證資訊。</text><rect x="555" y="480" width="490" height="280" rx="22" fill="white" stroke="#b8cce4" stroke-width="3"/><rect x="555" y="480" width="490" height="62" rx="22" fill="#198754"/><text x="585" y="522" font-size="30" fill="white" font-weight="700">5. 採取安全行動</text><text x="590" y="600" font-size="24">不登入、不提供個資，改走官方查證，</text><text x="590" y="640" font-size="24">並封鎖或檢舉。</text><rect x="1075" y="480" width="490" height="280" rx="22" fill="white" stroke="#b8cce4" stroke-width="3"/><rect x="1075" y="480" width="490" height="62" rx="22" fill="#198754"/><text x="1105" y="522" font-size="30" fill="white" font-weight="700">6. 完成學習</text><text x="1110" y="600" font-size="24">記住「先停、看一看、查一查、</text><text x="1110" y="640" font-size="24">再決定」，並遷移到其他情境。</text><rect x="35" y="800" width="1530" height="65" rx="18" fill="#eaf2ff" stroke="#0b5dbb"/><text x="70" y="843" font-size="24" font-weight="700">故事重點：從真實社群情境出發；短時間完成判斷與查證；不只提示風險，也教下一步。</text></g></svg>