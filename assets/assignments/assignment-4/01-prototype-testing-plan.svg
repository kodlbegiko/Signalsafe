<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#f5f9ff"/><rect width="1600" height="135" fill="#083b7a"/><text x="55" y="72" font-size="50" font-family="sans-serif" fill="white" font-weight="700">作業四｜4-1. 原型測試規劃與執行準備</text><text x="55" y="118" font-size="30" font-family="sans-serif" fill="#dcebff">新版原型依 GitHub 凍結規格進行16–18歲可用性測試</text><g font-family="sans-serif" fill="#17365d"><rect x="35" y="170" width="370" height="600" rx="22" fill="white" stroke="#b8cce4" stroke-width="3"/><rect x="35" y="170" width="370" height="68" rx="22" fill="#0b5dbb"/><text x="70" y="215" font-size="31" fill="white" font-weight="700">測試目的與對象</text><text x="75" y="300" font-size="23">• 驗證新版原型可用性</text><text x="75" y="350" font-size="23">• 不宣稱教育成效</text><text x="75" y="400" font-size="23">• 對象：16–18歲高中學生</text><text x="75" y="450" font-size="23">• 樣本：8–12位，分兩輪</text><text x="75" y="500" font-size="23">• Round 1先測4位</text><text x="75" y="550" font-size="23">• 修正後Round 2再測4–8位</text><text x="75" y="600" font-size="23">• 匿名：UT001–UT012</text><text x="75" y="650" font-size="23">• 不公開姓名、學校與班級</text><rect x="425" y="170" width="370" height="600" rx="22" fill="white" stroke="#b8cce4" stroke-width="3"/><rect x="425" y="170" width="370" height="68" rx="22" fill="#198754"/><text x="460" y="215" font-size="31" fill="white" font-weight="700">四項測試任務</text><text x="465" y="300" font-size="23">1. 完成90秒快練</text><text x="465" y="365" font-size="23">2. 閱讀回饋並找到</text><text x="490" y="400" font-size="23">官方查證方式</text><text x="465" y="465" font-size="23">3. 查看個人盲點／紀錄</text><text x="465" y="530" font-size="23">4. 使用急救模式找到</text><text x="490" y="565" font-size="23">停止操作與求助路徑</text><text x="465" y="650" font-size="23">每場約15–20分鐘</text><rect x="815" y="170" width="370" height="600" rx="22" fill="white" stroke="#b8cce4" stroke-width="3"/><rect x="815" y="170" width="370" height="68" rx="22" fill="#e67e22"/><text x="850" y="215" font-size="31" fill="white" font-weight="700">主持人與觀察</text><text x="855" y="300" font-size="23">• 測試網站，不是測試受測者</text><text x="855" y="350" font-size="23">• 鼓勵放聲思考</text><text x="855" y="400" font-size="23">• 不暗示正確答案</text><text x="855" y="450" font-size="23">• 記錄完成、提示、誤觸、</text><text x="880" y="485" font-size="23">回頭與受測者原話</text><text x="855" y="550" font-size="23">• 問題依P0–P3分級</text><text x="855" y="600" font-size="23">• Round 1後只修P0／P1</text><text x="855" y="650" font-size="23">• 再凍結Round 2版本</text><rect x="1205" y="170" width="360" height="600" rx="22" fill="white" stroke="#b8cce4" stroke-width="3"/><rect x="1205" y="170" width="360" height="68" rx="22" fill="#6f42c1"/><text x="1240" y="215" font-size="31" fill="white" font-weight="700">隱私與產出</text><text x="1245" y="300" font-size="23">• 不錄臉</text><text x="1245" y="350" font-size="23">• 預設不錄原始聲音</text><text x="1245" y="400" font-size="23">• 不收帳號、密碼、OTP</text><text x="1245" y="450" font-size="23">• 聯絡與作答資料分開保存</text><text x="1245" y="520" font-size="23">本階段產出：</text><text x="1245" y="565" font-size="22">版本凍結、主持稿、觀察表、</text><text x="1245" y="600" font-size="22">問卷、問題分級、修改前後對照</text><text x="1245" y="635" font-size="22">及作業四報告</text><rect x="35" y="800" width="1530" height="65" rx="18" fill="#eaf2ff" stroke="#0b5dbb"/><text x="70" y="843" font-size="24" font-weight="700">完成兩輪測試後，才能把作業從「規劃」推進到「具備真實證據的原型驗證」。</text></g></svg>