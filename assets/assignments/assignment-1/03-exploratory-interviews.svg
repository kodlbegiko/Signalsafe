<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#f5f9ff"/><rect width="1600" height="135" fill="#083b7a"/><text x="55" y="72" font-size="50" font-family="sans-serif" fill="white" font-weight="700">作業一｜3. 實際訪談目標族群</text><text x="55" y="118" font-size="30" font-family="sans-serif" fill="#dcebff">三位探索性訪談：U001–U003</text><g font-family="sans-serif" fill="#17365d"><rect x="35" y="175" width="500" height="560" rx="22" fill="white" stroke="#b8cce4" stroke-width="3"/><rect x="35" y="175" width="500" height="68" rx="22" fill="#6f42c1"/><text x="70" y="220" font-size="31" fill="white" font-weight="700">U001｜大一學生</text><text x="75" y="300" font-size="24">• 常用 Instagram、手機遊戲</text><text x="75" y="360" font-size="24">• 曾遇填問卷中獎電話，未前往</text><text x="75" y="420" font-size="24">• 會搜尋主辦單位並詢問家人</text><text x="75" y="480" font-size="24">• 偏好遊戲式互動與真實案例</text><text x="75" y="540" font-size="24">• 認為五分鐘日常訓練偏長</text><rect x="550" y="175" width="500" height="560" rx="22" fill="white" stroke="#b8cce4" stroke-width="3"/><rect x="550" y="175" width="500" height="68" rx="22" fill="#6f42c1"/><text x="585" y="220" font-size="31" fill="white" font-weight="700">U002｜大一學生</text><text x="590" y="300" font-size="24">• 常用 Threads</text><text x="590" y="360" font-size="24">• 曾看到與官方公告不符的遊戲福利</text><text x="590" y="420" font-size="24">• 優先比對官網，必要時問父母</text><text x="590" y="480" font-size="24">• 希望學習封鎖、檢舉與通報</text><text x="590" y="540" font-size="24">• 可接受約五分鐘快節奏訓練</text><rect x="1065" y="175" width="500" height="560" rx="22" fill="white" stroke="#b8cce4" stroke-width="3"/><rect x="1065" y="175" width="500" height="68" rx="22" fill="#6f42c1"/><text x="1100" y="220" font-size="31" fill="white" font-weight="700">U003｜高中升大學階段</text><text x="1105" y="300" font-size="24">• 常用 Instagram、Facebook、LINE</text><text x="1105" y="360" font-size="24">• 遇可疑內容傾向不回覆、不給個資</text><text x="1105" y="420" font-size="24">• 依內容、來源及要求行為判斷</text><text x="1105" y="480" font-size="24">• 希望有故事情境、互動與短流程</text><text x="1105" y="540" font-size="24">• 完成前測，未納入前後測比較</text><rect x="35" y="760" width="1530" height="110" rx="18" fill="#edf8f2" stroke="#198754" stroke-width="3"/><text x="70" y="805" font-size="27" fill="#198754" font-weight="700">共同發現</text><text x="70" y="845" font-size="23">學生已有基本警覺，但缺少固定流程；日常快練應縮短、加入查證與求助，並避免全部判可疑仍得高分。</text></g></svg>