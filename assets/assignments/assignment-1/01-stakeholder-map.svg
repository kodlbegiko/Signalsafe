<path d="M1080 0 C1280 30, 1420 5, 1600 65 L1600 135 L1080 135 Z" fill="#0D5AA7" opacity=".75"/>
<text x="55" y="72" font-size="50" font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif" fill="white" font-weight="700">作業一｜1. 利害關係人盤點</text>
<text x="55" y="118" font-size="30" font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif" fill="#DCEBFF">SignalSafe｜16–18歲高中階段學生防詐決策訓練</text><rect x="40" y="170" width="470" height="620" rx="18" fill="white" stroke="#B8CCE4" stroke-width="2"/><rect x="40" y="170" width="470" height="58" rx="18" fill="#6F42C1"/><text x="66" y="210" font-size="30" font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif" fill="white" font-weight="700">核心與直接支持層</text><circle cx="68" cy="249" r="7" fill="#6F42C1"/><text x="88" y="258" font-size="23" font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif" fill="#17365D"><tspan x="88" dy="0">核心使用者：</tspan><tspan x="88" dy="31">16–18歲高中階段學生</tspan></text><circle cx="68" cy="331" r="7" fill="#6F42C1"/><text x="88" y="340" font-size="23" font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif" fill="#17365D"><tspan x="88" dy="0">普通型高中、</tspan><tspan x="88" dy="31">技術型高中、</tspan><tspan x="88" dy="31">五專低年級</tspan></text><circle cx="68" cy="441" r="7" fill="#6F42C1"/><text x="88" y="450" font-size="23" font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif" fill="#17365D"><tspan x="88" dy="0">教師／學校：</tspan><tspan x="88" dy="31">課堂導入與教學支持</tspan></text><circle cx="68" cy="523" r="7" fill="#6F42C1"/><text x="88" y="532" font-size="23" font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif" fill="#17365D"><tspan x="88" dy="0">家長／監護人：</tspan><tspan x="88" dy="31">陪伴討論與查證支持</tspan></text><circle cx="68" cy="605" r="7" fill="#6F42C1"/><text x="88" y="614" font-size="23" font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif" fill="#17365D"><tspan x="88" dy="0">同學／朋友：</tspan><tspan x="88" dy="31">訊息來源與互相提醒</tspan></text><circle cx="68" cy="687" r="7" fill="#6F42C1"/><text x="88" y="696" font-size="23" font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif" fill="#17365D"><tspan x="88" dy="0">專案團隊：</tspan><tspan x="88" dy="31">研究、設計、題庫與開發</tspan></text><circle cx="68" cy="769" r="7" fill="#6F42C1"/><text x="88" y="778" font-size="23" font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif" fill="#17365D"><tspan x="88" dy="0">受訪與測試學生：</tspan><tspan x="88" dy="31">提供需求及回饋</tspan></text>
<rect x="535" y="170" width="500" height="620" rx="18" fill="white" stroke="#B8CCE4" stroke-width="2"/><rect x="535" y="170" width="500" height="58" rx="18" fill="#198754"/><text x="561" y="210" font-size="30" font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif" fill="white" font-weight="700">間接影響層</text><circle cx="563" cy="249" r="7" fill="#198754"/><text x="583" y="258" font-size="23" font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif" fill="#17365D">165反詐騙專線與警政單位</text><circle cx="563" cy="303" r="7" fill="#198754"/><text x="583" y="312" font-size="23" font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif" fill="#17365D">教育部與學校行政單位</text><circle cx="563" cy="357" r="7" fill="#198754"/><text x="583" y="366" font-size="23" font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif" fill="#17365D">社群與通訊平台</text><circle cx="563" cy="411" r="7" fill="#198754"/><text x="583" y="420" font-size="23" font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif" fill="#17365D"><tspan x="583" dy="0">遊戲、電商、票券與二手交易平台</tspan></text><circle cx="563" cy="465" r="7" fill="#198754"/><text x="583" y="474" font-size="23" font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif" fill="#17365D">銀行與電子支付業者</text><circle cx="563" cy="519" r="7" fill="#198754"/><text x="583" y="528" font-size="23" font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif" fill="#17365D">事實查核及防詐教育組織</text><circle cx="563" cy="573" r="7" fill="#198754"/><text x="583" y="582" font-size="23" font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif" fill="#17365D">媒體、KOL與社群宣導者</text><circle cx="563" cy="627" r="7" fill="#198754"/><text x="583" y="636" font-size="23" font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif" fill="#17365D"><tspan x="583" dy="0">AI／技術協作者：</tspan><tspan x="583" dy="31">題庫整理與內容輔助</tspan></text>
<rect x="1060" y="170" width="500" height="620" rx="18" fill="white" stroke="#B8CCE4" stroke-width="2"/><rect x="1060" y="170" width="500" height="58" rx="18" fill="#C0392B"/><text x="1086" y="210" font-size="30" font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif" fill="white" font-weight="700">風險來源與專案位置</text><circle cx="1088" cy="249" r="7" fill="#C0392B"/><text x="1108" y="258" font-size="23" font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif" fill="#17365D"><tspan x="1108" dy="0">詐騙集團：</tspan><tspan x="1108" dy="31">主要風險來源</tspan></text><circle cx="1088" cy="331" r="7" fill="#C0392B"/><text x="1108" y="340" font-size="23" font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif" fill="#17365D"><tspan x="1108" dy="0">假帳號／盜用帳號：</tspan><tspan x="1108" dy="31">常見接觸入口</tspan></text><circle cx="1088" cy="413" r="7" fill="#C0392B"/><text x="1108" y="422" font-size="23" font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif" fill="#17365D"><tspan x="1108" dy="0">釣魚網站／釣魚頁面：</tspan><tspan x="1108" dy="31">高風險操作來源</tspan></text><circle cx="1088" cy="495" r="7" fill="#C0392B"/><text x="1108" y="504" font-size="23" font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif" fill="#17365D"><tspan x="1108" dy="0">SignalSafe位於學生、</tspan><tspan x="1108" dy="31">支持者與制度資源之間</tspan></text><circle cx="1088" cy="577" r="7" fill="#C0392B"/><text x="1108" y="586" font-size="23" font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif" fill="#17365D"><tspan x="1108" dy="0">用途：</tspan><tspan x="1108" dy="31">訓練辨識風險、停止操作、</tspan><tspan x="1108" dy="31">獨立查證與求助</tspan></text>
<text x="60" y="845" font-size="24" font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif" fill="#17365D" font-weight="700">利害關係人依使用距離與影響程度分層，作為後續訪談、設計與驗證的重點依據。</text>
