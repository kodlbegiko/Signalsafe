<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#f5f9ff"/><rect width="1600" height="135" fill="#083b7a"/><text x="55" y="72" font-size="50" font-family="sans-serif" fill="white" font-weight="700">作業一｜2. 目標族群是誰，為什麼重要？</text><text x="55" y="118" font-size="30" font-family="sans-serif" fill="#dcebff">主要目標族群：16–18歲高中階段學生</text><g font-family="sans-serif" fill="#17365d"><rect x="45" y="175" width="740" height="600" rx="22" fill="white" stroke="#b8cce4" stroke-width="3"/><rect x="45" y="175" width="740" height="68" rx="22" fill="#0b5dbb"/><text x="80" y="220" font-size="32" fill="white" font-weight="700">四項重要性</text><text x="85" y="300" font-size="27" font-weight="700">1. 高度接觸數位環境</text><text x="110" y="342" font-size="23">常用社群、通訊、遊戲、影音與交易服務</text><text x="85" y="415" font-size="27" font-weight="700">2. 自主決策快速增加</text><text x="110" y="457" font-size="23">開始處理帳號、個資、付款、活動與打工資訊</text><text x="85" y="530" font-size="27" font-weight="700">3. 熟悉科技不等於穩定判斷</text><text x="110" y="572" font-size="23">仍可能依賴直覺、單一關鍵字與熟人信任</text><text x="85" y="645" font-size="27" font-weight="700">4. 適合校園介入與擴散</text><text x="110" y="687" font-size="23">可透過班級、課程、社團及新生教育導入</text><rect x="815" y="175" width="740" height="600" rx="22" fill="white" stroke="#b8cce4" stroke-width="3"/><rect x="815" y="175" width="740" height="68" rx="22" fill="#198754"/><text x="850" y="220" font-size="32" fill="white" font-weight="700">支持角色與研究邊界</text><text x="855" y="305" font-size="27" font-weight="700">教師／學校</text><text x="1080" y="305" font-size="23">提供課堂與活動導入</text><text x="855" y="385" font-size="27" font-weight="700">家長／監護人</text><text x="1080" y="385" font-size="23">陪伴查證、討論與求助</text><text x="855" y="465" font-size="27" font-weight="700">現有證據</text><text x="1080" y="465" font-size="23">3位探索性訪談與原型測試</text><text x="855" y="545" font-size="27" font-weight="700">目前限制</text><text x="1080" y="545" font-size="23">樣本不完全等同最終目標族群</text><text x="855" y="625" font-size="27" font-weight="700">下一步</text><text x="1080" y="625" font-size="23">以16–18歲學生正式完成可用性測試</text><text x="855" y="705" font-size="27" font-weight="700">不可宣稱</text><text x="1080" y="705" font-size="23">此族群是所有人中最容易受騙</text><rect x="45" y="800" width="1510" height="62" rx="18" fill="#eaf2ff" stroke="#0b5dbb"/><text x="80" y="842" font-size="25" font-weight="700">總結：SignalSafe以16–18歲高中階段學生為主要目標，透過校園與家庭支持建立可遷移的防詐決策能力。</text></g></svg>