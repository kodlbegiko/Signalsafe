<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SignalSafe V2 Research Control</title>
<style>
body{margin:0;background:#f6f8fb;color:#13243a;font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif}main{width:min(960px,calc(100% - 32px));margin:40px auto}.panel{background:white;border:1px solid #dce5ef;border-radius:18px;padding:22px;margin:14px 0}h1{margin-top:0}label{display:grid;gap:6px;font-weight:700}input,select,textarea,button{font:inherit}input,select,textarea{min-height:44px;border:1px solid #c9d5e3;border-radius:10px;padding:8px 10px}textarea{min-height:90px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.tasks{display:grid;gap:10px}.task{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;border:1px solid #dce5ef;border-radius:13px;padding:14px}.task code{font-weight:800;color:#0f5bd7}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}button,a.button{min-height:42px;border:0;border-radius:10px;padding:0 13px;display:inline-flex;align-items:center;justify-content:center;background:#0f5bd7;color:white;font-weight:750;text-decoration:none}button.secondary,a.secondary{background:#edf3fb;color:#17385f}small{color:#63758a}.status{min-width:140px}.scenario-script{padding:18px;border-radius:14px;background:#eef6ff;border-left:4px solid #0f5bd7;line-height:1.7}.scenario-script strong{display:block;color:#0f5bd7;margin-bottom:6px}.task-prompt{margin:7px 0 0;line-height:1.55}.setup{display:inline-block;margin-top:8px;padding:5px 8px;border-radius:8px;background:#f1f5fa;color:#53677f;font-size:12px}.footer{color:#63758a;font-size:13px;margin-top:20px}@media(max-width:680px){.grid{grid-template-columns:1fr}.task{grid-template-columns:1fr}.status{min-width:0}}
</style>
</head>
<body><main><h1>SignalSafe V2 Research Control</h1><p>主持人專用。受試者只看到一般 SignalSafe；此頁負責情境口語稿、Independent Tasks、匿名 deep link 與 task outcome 紀錄。</p>
<section class="panel grid"><label>Study ID<input id="study" value="SST-V2"></label><label>Participant ID<input id="participant" placeholder="U001" autocomplete="off"></label><label>Scenario<select id="scenario"></select></label><label>Session note<input id="sessionNote" placeholder="可留空"></label></section>
<section class="panel"><h2>受試者情境</h2><div id="scenarioScript" class="scenario-script"></div></section>
<section class="panel"><h2>Independent Tasks</h2><p>一次只讀目前 Task。前一 Task FAIL 不會鎖住下一 Task；需要資料狀態時使用下方 setup 建立起始條件。</p><div id="tasks" class="tasks"></div></section>
<section class="panel actions"><a class="button secondary" href="./test-guide.html" target="_blank" rel="noopener">開啟完整測試說明</a><button id="export">匯出 task JSON</button><button class="secondary" id="clear">清除此 control 紀錄</button></section><p class="footer">PASS / PARTIAL / FAIL / NOT_ATTEMPTED 彼此獨立；不得用前一任務成敗替代下一任務的實際觀察。</p></main>
<script type="module">
import {V2_RESEARCH_SCENARIOS,V2_RESEARCH_TASKS,V2_TASK_STATUSES,buildV2StudyLink} from './study-v2.mjs';
const KEY='signalsafe:v2:moderator';
const $=(s)=>document.querySelector(s); let records=JSON.parse(localStorage.getItem(KEY)||'{}');
$('#scenario').innerHTML=V2_RESEARCH_SCENARIOS.map((s,index)=>`<option value="${s.id}">${index===0?'A':'B'}｜${s.title}</option>`).join('');
function current(){return {studyId:$('#study').value.trim()||'SST-V2',participantId:$('#participant').value.trim().toUpperCase(),scenarioId:$('#scenario').value,sessionNote:$('#sessionNote').value.trim()}}
function save(){localStorage.setItem(KEY,JSON.stringify(records))}
function render(){const c=current(),scenario=V2_RESEARCH_SCENARIOS.find(s=>s.id===c.scenarioId);$('#scenarioScript').innerHTML=`<strong>${scenario?.title||''}</strong>${scenario?.prompt||''}`;$('#tasks').innerHTML=V2_RESEARCH_TASKS.filter(t=>t.scenarioId===c.scenarioId).map(t=>{const key=`${c.studyId}:${c.participantId}:${t.id}`,r=records[key]||{status:'NOT_ATTEMPTED',note:''};const href=buildV2StudyLink({studyId:c.studyId,participantId:c.participantId,taskId:t.id,route:t.startRoute});return `<article class="task"><code>${t.id}</code><div><strong>${t.goal}</strong><p class="task-prompt"><b>念給受試者：</b>${t.participantPrompt}</p><span class="setup">Start: ${t.startRoute} · Setup: ${t.setup}</span><div class="actions"><a class="button secondary" href="${href}" target="_blank" rel="noopener">開啟受試者頁面</a></div></div><div><select class="status" data-key="${key}">${V2_TASK_STATUSES.map(s=>`<option ${r.status===s?'selected':''}>${s}</option>`).join('')}</select><textarea data-note="${key}" placeholder="主持人備註">${r.note||''}</textarea></div></article>`}).join('');document.querySelectorAll('[data-key]').forEach(el=>el.onchange=()=>{records[el.dataset.key]={...(records[el.dataset.key]||{}),status:el.value,updatedAt:new Date().toISOString()};save()});document.querySelectorAll('[data-note]').forEach(el=>el.oninput=()=>{records[el.dataset.note]={...(records[el.dataset.note]||{}),note:el.value,updatedAt:new Date().toISOString()};save()})}
['study','participant','sessionNote'].forEach(id=>$('#'+id).addEventListener('input',render));$('#scenario').addEventListener('change',render);
$('#export').onclick=()=>{const c=current();const payload={exportedAt:new Date().toISOString(),...c,protocolVersion:'signalsafe-v2-usability-2026-08-16',tasks:Object.entries(records).filter(([k])=>k.startsWith(`${c.studyId}:${c.participantId}:`)).map(([key,value])=>({taskId:key.split(':').at(-1),...value}))};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`signalsafe-v2-tasks-${c.participantId||'unknown'}.json`;a.click();URL.revokeObjectURL(url)};
$('#clear').onclick=()=>{if(confirm('清除此主持人 control 的 task 紀錄？')){records={};save();render()}};render();
</script></body></html>
